services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iort
      POSTGRES_USER: iort
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U iort -d iort"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  terminal:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    # The Kotak Neo login comes from section 1 of .env only (gitignored, readable by you alone). Host
    # environment variables are deliberately not passed through: a stale value there would silently
    # override .env and send old credentials, and every refused login counts toward Kotak's lockout.
    environment:
      DATA_DIR: /app/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./data:/app/data"]
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
